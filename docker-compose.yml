services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: email_reader
      POSTGRES_PASSWORD: email_reader
      POSTGRES_DB: email_reader
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U email_reader"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
