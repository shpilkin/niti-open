[project]
name = "email-reader"
version = "0.1.0"
description = "Project-aware Commitment OS — turns multiple mailboxes into tracked commitments"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "openai>=1.40",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "aiogram>=3.13",
    "apscheduler>=3.10",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "python-dateutil>=2.9",
    "cryptography>=43.0",
    "nh3>=0.2",
    "caldav>=1.3",
    "icalendar>=5.0",
    # Russian stems for the search index (pure Python, no data files).
    "snowballstemmer>=2.2",
    # MCP server: Niti's data as tools for an outside agent (/mcp).
    "mcp>=2.1",
]

[project.optional-dependencies]
# Optional Postgres driver for the always-on server topology.
postgres = [
    "asyncpg>=0.29",
]
# Tooling to freeze the backend into the macOS app bundle + generate the icon.
build = [
    "pyinstaller>=6.0",
    "pillow>=10.0",
]
dev = [
    "ruff>=0.6",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-playwright>=0.5",  # e2e browser tests (run: pytest -m e2e tests/e2e)
]

[project.scripts]
email-reader = "email_reader.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["email_reader"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection markers are call-in-default by design (like Form/Depends).
extend-immutable-calls = ["fastapi.File"]

[tool.ruff.lint.per-file-ignores]
# Alembic migrations are machine-generated; don't enforce line length there.
"alembic/versions/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# E2E (Playwright) tests need a browser + a live server; excluded from the default run.
# Run them with:  pytest -m e2e tests/e2e
addopts = "-m 'not e2e'"
markers = [
    "e2e: end-to-end browser tests (require Playwright + chromium)",
]
